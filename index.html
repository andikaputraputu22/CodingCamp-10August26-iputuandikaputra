<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <!-- Apply stored theme before first paint to prevent flash -->
  <script>
    (function () {
      var t = localStorage.getItem('dashboard_theme');
      if (t === 'light' || t === 'dark') {
        document.documentElement.setAttribute('data-theme', t);
      }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen font-sans" id="app-body">

  <!-- ===== HEADER: Greeting & Clock ===== -->
  <header class="w-full px-4 pt-8 pb-6 text-center relative">

    <!-- Theme toggle (top-right) -->
    <button
      id="theme-toggle-btn"
      class="theme-toggle-btn"
      title="Toggle light/dark mode"
      aria-label="Toggle theme"
    >
      <span id="theme-icon">🌙</span>
    </button>
    <!-- Greeting row: text + edit button, toggled with inline name input -->
    <div class="flex items-center justify-center gap-2">
      <p id="greeting" class="text-lg text-indigo-400 font-medium tracking-wide"></p>
      <button id="greeting-edit-btn" class="greeting-edit-btn" title="Change your name" aria-label="Edit name">
        ✏️
      </button>
    </div>

    <!-- Inline name editor (hidden by default) -->
    <div id="greeting-name-editor" class="hidden flex items-center justify-center gap-2 mt-2">
      <input
        id="greeting-name-input"
        type="text"
        placeholder="Your name…"
        maxlength="40"
        class="input-field text-center w-48"
      />
      <button id="greeting-name-save" class="btn-primary px-3 py-1.5 text-sm">Save</button>
      <button id="greeting-name-cancel" class="btn-ghost px-3 py-1.5 text-sm">Cancel</button>
    </div>

    <h1 id="clock" class="text-5xl sm:text-7xl font-bold tabular-nums mt-1 drop-shadow-lg"></h1>
    <p id="date-display" class="text-sm mt-2"></p>

    <!-- ===== QUICK LINK CHIPS (inline, below date) ===== -->
    <div class="mt-10 max-w-2xl mx-auto">
      <!-- Chips row -->
      <div id="links-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3 min-h-[80px]"></div>
      <p id="links-empty" class="text-center text-gray-600 text-xs mt-2 hidden">No quick links yet.</p>

      <!-- Toggle button + inline form — same max-width as chips grid -->
      <div class="mt-3">
        <div class="flex items-center justify-center">
          <button id="add-link-toggle-btn" class="btn-ghost text-xs px-3 py-1.5">+ Add link</button>
        </div>

        <!-- Form expands to fill the same width as the chips container -->
        <div id="add-link-form" class="hidden mt-2">
          <div class="flex flex-wrap gap-2 items-center justify-center">
            <input
              id="link-name-input"
              type="text"
              placeholder="Label (e.g. GitHub)"
              class="input-field min-w-0 flex-1 basis-28"
              maxlength="30"
            />
            <input
              id="link-url-input"
              type="url"
              placeholder="https://..."
              class="input-field min-w-0 flex-[2] basis-40"
              maxlength="200"
            />
            <button id="link-add-btn" class="btn-primary text-xs px-4 py-2 shrink-0">Add</button>
            <button id="add-link-cancel-btn" class="btn-ghost text-xs px-3 py-2 shrink-0">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== MAIN GRID ===== -->
  <main class="max-w-5xl mx-auto px-4 pb-12 grid grid-cols-1 md:grid-cols-2 gap-6 mt-4 md:items-stretch">

    <!-- ===== FOCUS TIMER ===== -->
    <section class="card col-span-1 flex flex-col">
      <div class="flex items-center gap-2 mb-4">
        <span class="text-xl">🍅</span>
        <h2 class="section-title">Focus Timer</h2>
      </div>
      <div class="flex flex-col items-center justify-center gap-4 flex-1">

        <!-- Duration setter -->
        <div class="flex items-center gap-2">
          <label for="timer-minutes-input" class="text-xs text-gray-400 whitespace-nowrap">Duration (min)</label>
          <input
            id="timer-minutes-input"
            type="number"
            min="1"
            max="120"
            value="25"
            class="input-field w-20 text-center text-sm"
            title="Set timer duration in minutes"
          />
          <button id="timer-set-btn" class="btn-ghost text-xs px-3">Set</button>
        </div>

        <div id="timer-display" class="text-6xl font-bold tabular-nums timer-ring px-8 py-4 rounded-2xl">
          25:00
        </div>
        <div class="flex gap-3 flex-wrap justify-center">
          <button id="timer-start" class="btn-primary">&#9654; Start</button>
          <button id="timer-stop" class="btn-secondary">&#9646;&#9646; Pause</button>
          <button id="timer-reset" class="btn-ghost">&#8635; Reset</button>
        </div>
        <p id="timer-status" class="text-sm text-gray-400">Ready to focus</p>
      </div>
    </section>

    <!-- ===== TO-DO LIST ===== -->
    <section class="card col-span-1 flex flex-col">
      <div class="flex items-center gap-2 mb-4">
        <span class="text-xl">&#9989;</span>
        <h2 class="section-title">To-Do List</h2>
      </div>

      <!-- Add task form -->
      <div class="flex gap-2 mb-3">
        <input
          id="task-input"
          type="text"
          placeholder="Add a new task..."
          class="input-field flex-1"
          maxlength="120"
        />
        <button id="task-add-btn" class="btn-primary px-4">Add</button>
      </div>

      <!-- Progress bar -->
      <div class="progress-bar-track">
        <div id="progress-bar-fill" class="progress-bar-fill" style="width:0%"></div>
      </div>

      <!-- Sort controls -->
      <div class="flex items-center gap-2 mb-3">
        <label for="sort-select" class="text-xs text-gray-500 whitespace-nowrap">Sort:</label>
        <select id="sort-select" class="sort-select">
          <option value="default">Default</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
          <option value="active-first">Active first</option>
          <option value="done-first">Done first</option>
        </select>
      </div>

      <!-- Task stats -->
      <div class="flex gap-2 mb-3 flex-wrap">
        <span class="stat-pill stat-pill--total">
          <span class="stat-pill__icon">📋</span>
          <span id="task-total">0 tasks</span>
        </span>
        <span class="stat-pill stat-pill--done">
          <span class="stat-pill__icon">✅</span>
          <span id="task-done-count">0 done</span>
        </span>
        <span class="stat-pill stat-pill--remaining">
          <span class="stat-pill__icon">⏳</span>
          <span id="task-remaining">0 remaining</span>
        </span>
      </div>

      <!-- Task list -->
      <ul id="task-list" class="flex flex-col gap-2 overflow-y-auto flex-1 pr-1"></ul>
      <p id="task-empty" class="text-center text-gray-500 text-sm mt-6 hidden">No tasks yet. Add one above!</p>
    </section>

  </main>

  <!-- ===== EDIT TASK MODAL ===== -->
  <div id="edit-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 class="text-lg font-semibold mb-3 text-white">Edit Task</h3>
      <input id="edit-task-input" type="text" class="input-field w-full mb-4" maxlength="120" />
      <div class="flex justify-end gap-2">
        <button id="edit-cancel-btn" class="btn-ghost">Cancel</button>
        <button id="edit-save-btn" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- ===== EDIT LINK MODAL ===== -->
  <div id="edit-link-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 class="text-lg font-semibold mb-3 text-white">Edit Link</h3>
      <input id="edit-link-name-input" type="text" class="input-field w-full mb-2" placeholder="Label" maxlength="30" />
      <input id="edit-link-url-input" type="url" class="input-field w-full mb-4" placeholder="https://..." maxlength="200" />
      <div class="flex justify-end gap-2">
        <button id="edit-link-cancel-btn" class="btn-ghost">Cancel</button>
        <button id="edit-link-save-btn" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- ===== CUSTOM ALERT ===== -->
  <div id="custom-alert" class="custom-alert hidden" role="alert" aria-live="assertive">
    <span id="custom-alert-icon" class="custom-alert-icon">⚠️</span>
    <span id="custom-alert-message" class="custom-alert-message"></span>
    <button id="custom-alert-close" class="custom-alert-close" aria-label="Dismiss">&times;</button>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
